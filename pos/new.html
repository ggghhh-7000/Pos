<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOK-什麼都有店 - 前台點餐收銀系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("YOUR_EMAILJS_USER_ID"); // 可填入您的 EmailJS Public Key
        })();
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @media print {
            body * { visibility: hidden; }
            #receipt-print-area, #receipt-print-area * { visibility: visible; }
            #receipt-print-area { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col font-sans overflow-hidden">

    <!-- 頂部導覽列 -->
    <header class="bg-slate-900 text-white px-4 py-3 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <h1 class="text-lg font-bold tracking-wide">LOK-什麼都有店 (前台點餐)</h1>
            <span id="sync-status" class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded border border-slate-700">同步中...</span>
        </div>
        <div class="flex items-center space-x-3 text-xs text-slate-300">
            <span>桌號: <strong class="text-amber-400 font-mono" id="current-table-display">內用-桌號 01</strong></span>
            <span>營業額: <strong class="text-emerald-400 font-mono">$<span id="shift-sales">0</span></strong></span>
            <button onclick="toggleVideoRecorder()" class="bg-rose-600 hover:bg-rose-700 text-white px-2.5 py-1 rounded font-bold transition">🎥 錄影存證 (.mov)</button>
            <button onclick="exportPageHTML()" class="bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded border border-slate-700 transition">💾 存檔 HTML</button>
            <button onclick="fetchDataFromCloud()" class="bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded border border-slate-700 transition">🔄 同步</button>
        </div>
    </header>

    <!-- 主內容區 -->
    <main class="flex-1 flex overflow-hidden p-3 gap-3">
        
        <!-- 左側：商品目錄與分類 -->
        <section class="flex-1 flex flex-col bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <!-- 桌面與用餐資訊列 -->
            <div class="p-3 bg-slate-50 border-b border-slate-200 flex flex-wrap gap-2 items-center justify-between text-xs">
                <div class="flex items-center gap-2">
                    <span class="font-bold text-slate-700">用餐類型:</span>
                    <select id="order-type" onchange="updateTableInfo()" class="border rounded px-2 py-1 bg-white">
                        <option value="內用">內用</option>
                        <option value="外帶">外帶</option>
                    </select>
                    <span class="font-bold text-slate-700">桌號:</span>
                    <input type="text" id="table-number" value="01" oninput="updateTableInfo()" class="w-16 border rounded px-2 py-1 text-center font-mono">
                </div>
                <div class="flex gap-1 overflow-x-auto no-scrollbar py-1" id="category-tabs">
                    <button onclick="filterCategory('all')" class="cat-btn px-3 py-1 bg-blue-600 text-white rounded-lg font-bold text-xs whitespace-nowrap">全部品項</button>
                    
                </div>
            </div>

            <!-- 搜尋與品項列表 -->
            <div class="p-3 border-b border-slate-200 bg-white">
                <input type="text" id="search-input" placeholder="🔍 搜尋商品名稱或編號 (如 A1、牛肉麵)..." oninput="handleSearch()"
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div id="product-grid" class="flex-1 p-3 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 overflow-y-auto"></div>
        </section>

        <!-- 右側：購物車與結帳 -->
        <section class="w-96 bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col">
            <div class="p-3 border-b border-slate-200 flex justify-between items-center bg-slate-50 rounded-t-xl">
                <h2 class="font-bold text-slate-700 text-sm">📋 當前點餐明細</h2>
                <button onclick="clearCart()" class="text-xs text-red-500 hover:underline">清空</button>
            </div>

            <!-- 購物車列表 -->
            <div id="cart-list" class="flex-1 overflow-y-auto p-3 divide-y divide-slate-100">
                <p class="text-slate-400 text-center py-10 text-sm">購物車是空的</p>
            </div>

            <!-- 整張訂單備註 -->
            <div class="p-3 bg-slate-50 border-t border-slate-200">
                <label class="block text-xs font-bold text-slate-600 mb-1">📝 訂單備註 </label>
                <input type="text" id="order-note" placeholder="請輸入整單備註..." class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-xs bg-white">
            </div>

            <!-- 結帳金額與按鈕 -->
            <div class="p-4 border-t border-slate-200 bg-slate-50 rounded-b-xl flex flex-col gap-2">
                <div class="flex justify-between items-center text-slate-500 text-xs">
                    <span>總數量：</span>
                    <span id="cart-count" class="font-semibold text-slate-700">0 件</span>
                </div>
                <div class="flex justify-between items-baseline pt-2 border-t border-slate-200">
                    <span class="text-slate-700 font-bold">總計金額：</span>
                    <span class="text-2xl font-extrabold text-blue-600">$<span id="cart-total">0</span></span>
                </div>
                <button onclick="openCheckoutModal()" id="checkout-btn" disabled class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold text-base shadow-md transition disabled:opacity-50 disabled:cursor-not-allowed mt-1">
                    💳 前往結帳送出
                </button>
            </div>
        </section>

    </main>

    <!-- ================= 結帳與 Email 寄送 Modal ================= -->
    <div id="checkout-modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 backdrop-blur-sm z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
            <h3 class="text-lg font-bold mb-1 text-slate-800">💰 結帳與發票作業</h3>
            <p class="text-xs text-slate-500 mb-4">結帳完成後才會發送到廚房製作，並可透過 Email 寄送帳單</p>
            
            <div class="space-y-3">
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 flex justify-between items-center">
                    <span class="text-sm font-medium text-slate-600">應付總額：</span>
                    <span class="text-xl font-extrabold text-blue-600">$<span id="modal-total-display">0</span></span>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">付款方式</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button type="button" onclick="setPaymentMethod('現金')" id="pay-cash-btn" class="py-2 border-2 border-blue-600 bg-blue-50 text-blue-700 text-xs font-bold rounded-lg transition">💵 現金</button>
                        <button type="button" onclick="setPaymentMethod('信用卡')" id="pay-card-btn" class="py-2 border-2 border-slate-200 text-slate-600 text-xs font-bold rounded-lg transition">💳 信用卡</button>
                        <button type="button" onclick="setPaymentMethod('行動支付')" id="pay-mobile-btn" class="py-2 border-2 border-slate-200 text-slate-600 text-xs font-bold rounded-lg transition">📱 行動支付</button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">📧 寄送帳單至顧客 Email (選填)</label>
                    <input type="email" id="customer-email" placeholder="customer@example.com" 
                        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono">
                </div>
            </div>

            <div class="mt-5 flex justify-end space-x-2">
                <button onclick="closeCheckoutModal()" class="px-4 py-2 text-slate-600 text-sm hover:bg-slate-100 rounded-xl">取消</button>
                <button onclick="processCheckout()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-xl shadow-md transition">確認結帳並送出</button>
            </div>
        </div>
    </div>

    <!-- ================= 錄影存證 Modal ================= -->
    <div id="video-modal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 backdrop-blur-sm z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 flex flex-col items-center">
            <h3 class="text-lg font-bold mb-2 text-slate-800">📹 櫃台錄影存證 (.mov)</h3>
            <video id="webcam-preview" autoplay muted class="w-full h-48 bg-black rounded-xl mb-4 object-cover border border-slate-300"></video>
            <div class="flex w-full space-x-2">
                <button id="start-rec-btn" onclick="startRecording()" class="flex-1 bg-rose-600 text-white py-2 rounded-xl text-xs font-bold shadow">🔴 開始錄影</button>
                <button id="stop-rec-btn" onclick="stopRecording()" disabled class="flex-1 bg-slate-400 text-white py-2 rounded-xl text-xs font-bold shadow disabled:opacity-50">⏹ 停止並導出 .mov</button>
                <button onclick="closeVideoModal()" class="px-3 py-2 text-slate-600 text-xs hover:bg-slate-100 rounded-xl">關閉</button>
            </div>
        </div>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        const CONFIG = {
            apiKey: "$2a$10$Q3e6T7l53HKgJr3pc5tuW.5dTGTAyi6948TrSpoe7mNIZm6kaRMbm",
            binId: "6ada3777ac6210605a49804e"
        };

        // 預設精選品項（對應範本）
        let products = [
            { id: "A1", sku: "A1", name: "嵐山賞櫻 (草莓風味)", price: 120, stock: 50, category: "嵐山飄雪" },
            { id: "A2", sku: "A2", name: "嵐山竹影 (抹茶風味)", price: 120, stock: 50, category: "嵐山飄雪" },
            { id: "A3", sku: "A3", name: "嵐山賞楓 (芒果風味)", price: 120, stock: 50, category: "嵐山飄雪" },
            { id: "A4", sku: "A4", name: "芒果大福雪花冰", price: 140, stock: 40, category: "水果田" },
            { id: "A5", sku: "A5", name: "西瓜小丸子雪花冰", price: 120, stock: 40, category: "水果田" },
            { id: "B1", sku: "B1", name: "巧克力OREO雪花冰", price: 85, stock: 50, category: "經典町" },
            { id: "B3", sku: "B3", name: "春雨抹茶雪花冰", price: 110, stock: 30, category: "經典町" },
            { id: "B9", sku: "B9", name: "雪戀豆花", price: 95, stock: 40, category: "雪見豆花" },
            { id: "C1", sku: "C1", name: "牛奶雪花冰 (自選料)", price: 65, stock: 60, category: "自選冰料" },
            { id: "D1", sku: "D1", name: "紅燒牛肉麵", price: 150, stock: 25, category: "牛肉麵" },
            { id: "T1", sku: "T1", name: "奶酥厚片吐司", price: 40, stock: 40, category: "厚片吐司" },
            { id: "Q4", sku: "Q4", name: "爆料嫩仙草1號", price: 65, stock: 40, category: "爆料嫩仙草" },
            { id: "Q17", sku: "Q17", name: "黑蜜刨冰1號", price: 70, stock: 40, category: "黑蜜刨冰" }
        ];

        let orders = [];
        let cart = [];
        let currentCategory = 'all';
        let currentPaymentMethod = '現金';
        let shiftTotalSales = 0;

        let mediaRecorder, recordedChunks = [], mediaStream;

        window.onload = async () => {
            await fetchDataFromCloud();
            renderProducts();
            renderCart();
            updateTableInfo();
        };

        function updateTableInfo() {
            const type = document.getElementById('order-type').value;
            const tableNum = document.getElementById('table-number').value;
            document.getElementById('current-table-display').innerText = `${type}-桌號 ${tableNum}`;
        }

        async function fetchDataFromCloud() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${CONFIG.binId}/latest`, {
                    headers: { 'X-Master-Key': CONFIG.apiKey }
                });
                if (!res.ok) throw new Error();
                const data = await res.json();
                if (data.record && Array.isArray(data.record.products) && data.record.products.length > 0) {
                    products = data.record.products;
                }
                orders = Array.isArray(data.record.orders) ? data.record.orders : [];
                document.getElementById('sync-status').innerText = "線上連線";
                document.getElementById('sync-status').className = "text-xs bg-emerald-500 text-white px-2.5 py-1 rounded";
                renderProducts();
            } catch (e) {
                document.getElementById('sync-status').innerText = "離線模式";
                document.getElementById('sync-status').className = "text-xs bg-red-500 text-white px-2.5 py-1 rounded";
            }
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn px-3 py-1 bg-slate-100 text-slate-700 rounded-lg font-bold text-xs whitespace-nowrap hover:bg-slate-200";
            });
            event.target.className = "cat-btn px-3 py-1 bg-blue-600 text-white rounded-lg font-bold text-xs whitespace-nowrap";
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            const query = document.getElementById('search-input').value.toLowerCase();
            
            let list = products;
            if (currentCategory !== 'all') {
                list = list.filter(p => p.category === currentCategory);
            }
            if (query) {
                list = list.filter(p => p.name.toLowerCase().includes(query) || p.sku.toLowerCase().includes(query));
            }

            if (list.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center text-slate-400 py-10">沒有找到符合的品項</div>`;
                return;
            }

            grid.innerHTML = list.map(p => `
                <div onclick="addToCart('${p.id || p.sku}')" 
                     class="bg-slate-50 hover:bg-blue-50 border border-slate-200 hover:border-blue-300 rounded-xl p-3 cursor-pointer flex flex-col justify-between transition shadow-sm">
                    <div>
                        <div class="text-[10px] text-slate-400 mb-1 font-mono">${p.sku} | ${p.category || '其他'}</div>
                        <div class="font-bold text-slate-800 text-xs group-hover:text-blue-600 line-clamp-2">${p.name}</div>
                    </div>
                    <div class="mt-3 flex justify-between items-end">
                        <span class="text-[11px] text-slate-500">庫存: ${p.stock}</span>
                        <span class="font-extrabold text-blue-600 text-sm">$${p.price}</span>
                    </div>
                </div>
            `).join('');
        }

        function handleSearch() {
            renderProducts();
        }

        function addToCart(id) {
            const p = products.find(item => (item.id === id || item.sku === id));
            if (!p || p.stock <= 0) {
                alert("此商品庫存不足");
                return;
            }

            const existing = cart.find(item => item.id === id);
            if (existing) {
                if (existing.quantity + 1 > p.stock) {
                    alert("超過剩餘庫存");
                    return;
                }
                existing.quantity += 1;
            } else {
                cart.push({ id, name: p.name, price: p.price, quantity: 1, note: '' });
            }
            renderCart();
        }

        function updateQty(id, change) {
            const item = cart.find(i => i.id === id);
            const p = products.find(prod => (prod.id === id || prod.sku === id));
            if (!item || !p) return;

            if (change > 0 && item.quantity + change > p.stock) {
                alert("超過剩餘庫存");
                return;
            }

            item.quantity += change;
            if (item.quantity <= 0) {
                cart = cart.filter(i => i.id !== id);
            }
            renderCart();
        }

        function updateItemNote(id, note) {
            const item = cart.find(i => i.id === id);
            if (item) item.note = note;
        }

        function clearCart() {
            cart = [];
            document.getElementById('order-note').value = '';
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-list');
            if (cart.length === 0) {
                container.innerHTML = `<p class="text-slate-400 text-center py-10 text-sm">購物車是空的</p>`;
                document.getElementById('cart-count').innerText = `0 件`;
                document.getElementById('cart-total').innerText = 0;
                document.getElementById('checkout-btn').disabled = true;
                return;
            }

            let total = 0;
            let totalQty = 0;

            container.innerHTML = cart.map(item => {
                const subtotal = item.price * item.quantity;
                total += subtotal;
                totalQty += item.quantity;

                return `
                    <div class="py-2.5 space-y-2 border-b border-slate-100 text-sm">
                        <div class="flex justify-between items-center">
                            <span class="font-semibold text-slate-700 text-xs">${item.name}</span>
                            <div class="flex items-center space-x-2">
                                <span class="font-bold text-slate-800 text-xs">$${subtotal}</span>
                                <div class="flex items-center border rounded border-slate-200 bg-slate-50">
                                    <button onclick="updateQty('${item.id}', -1)" class="px-2 py-0.5 text-xs">-</button>
                                    <span class="px-1 text-xs font-semibold">${item.quantity}</span>
                                    <button onclick="updateQty('${item.id}', 1)" class="px-2 py-0.5 text-xs">+</button>
                                </div>
                            </div>
                        </div>
                        <input type="text" placeholder="單品備註 (例: 少冰)" value="${item.note || ''}" oninput="updateItemNote('${item.id}', this.value)"
                            class="w-full text-[11px] border border-slate-200 rounded px-2 py-1 bg-slate-50">
                    </div>
                `;
            }).join('');

            document.getElementById('cart-count').innerText = `${totalQty} 件`;
            document.getElementById('cart-total').innerText = total;
            document.getElementById('checkout-btn').disabled = false;
        }

        function openCheckoutModal() {
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('modal-total-display').innerText = total;
            document.getElementById('customer-email').value = '';
            document.getElementById('checkout-modal').classList.remove('hidden');
        }

        function closeCheckoutModal() {
            document.getElementById('checkout-modal').classList.add('hidden');
        }

        function setPaymentMethod(method) {
            currentPaymentMethod = method;
            ['现金', '信用卡', '行動支付'].forEach(m => {
                const btn = document.getElementById(`pay-${m === '现金' ? 'cash' : (m === '信用卡' ? 'card' : 'mobile')}-btn`);
                if (m === method) {
                    btn.className = "py-2 border-2 border-blue-600 bg-blue-50 text-blue-700 text-xs font-bold rounded-lg transition shadow-sm";
                } else {
                    btn.className = "py-2 border-2 border-slate-200 text-slate-600 text-xs font-bold rounded-lg transition";
                }
            });
        }

        async function processCheckout() {
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const type = document.getElementById('order-type').value;
            const tableNum = document.getElementById('table-number').value;
            const orderNote = document.getElementById('order-note').value.trim();
            const customerEmail = document.getElementById('customer-email').value.trim();

            // 扣除庫存
            for (let item of cart) {
                let p = products.find(prod => (prod.id === item.id || prod.sku === item.id));
                if (p) p.stock -= item.quantity;
            }

            const newOrder = {
                orderId: `ORD-${Date.now().toString().slice(-8)}`,
                table: `${type} - 桌號 ${tableNum}`,
                time: new Date().toLocaleString(),
                items: [...cart],
                total,
                method: currentPaymentMethod,
                note: orderNote || '無',
                customerEmail: customerEmail || '未填',
                status: '未製作完成'
            };

            orders.push(newOrder);

            try {
                await fetch(`https://api.jsonbin.io/v3/b/${CONFIG.binId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': CONFIG.apiKey },
                    body: JSON.stringify({ products, orders })
                });

                // 若有填寫 Email，透過 EmailJS 寄送
                if (customerEmail) {
                    const itemsText = newOrder.items.map(i => `${i.name} x${i.quantity} (備註: ${i.note || '無'})`).join('\n');
                    emailjs.send("default_service", "template_id", {
                        to_email: customerEmail,
                        order_id: newOrder.orderId,
                        order_table: newOrder.table,
                        order_details: itemsText,
                        order_total: newOrder.total,
                        order_note: newOrder.note
                    }).catch(err => console.log('Email 寄送略過或設定中'));
                }

                alert(`✅ 結帳成功！訂單 ${newOrder.orderId} 已送至廚房。`);
                closeCheckoutModal();
                clearCart();
                renderProducts();
            } catch (err) {
                alert('結帳同步失敗');
            }
        }

        function exportPageHTML() {
            const html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const blob = new Blob([html], { type: "text/html;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `LOK_POS_Backup_${new Date().toISOString().slice(0,10)}.html`;
            a.click();
        }

        async function toggleVideoRecorder() {
            document.getElementById('video-modal').classList.remove('hidden');
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('webcam-preview').srcObject = mediaStream;
            } catch (e) { alert("無法存取相機"); }
        }
        function closeVideoModal() {
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
            document.getElementById('video-modal').classList.add('hidden');
        }
        function startRecording() {
            recordedChunks = [];
            mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'video/quicktime' });
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.start();
            document.getElementById('start-rec-btn').disabled = true;
            document.getElementById('stop-rec-btn').disabled = false;
        }
        function stopRecording() {
            mediaRecorder.stop();
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/quicktime' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `POS_Record_${Date.now()}.mov`; a.click();
                document.getElementById('start-rec-btn').disabled = false;
                document.getElementById('stop-rec-btn').disabled = true;
            };
        }
    </script>
</body>
</html>
