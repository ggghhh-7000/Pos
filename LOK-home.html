<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOK 家族首頁 | LOK Family Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #2b5876;
      --secondary-color: #4e4376;
      --accent-color: #ff7e5f;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-main: #2d3748;
      --text-muted: #718096;
      --border-radius: 16px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
    }

    header {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      padding: 60px 20px 80px;
      text-align: center;
      position: relative;
      border-bottom-left-radius: 32px;
      border-bottom-right-radius: 32px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .header-content {
      max-width: 800px;
      margin: 0 auto;
    }

    .logo {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 8px;
      background: linear-gradient(to right, #ffffff, #feb47b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tagline {
      font-size: 1.05rem;
      opacity: 0.9;
      font-weight: 300;
    }

    main {
      max-width: 1080px;
      margin: -40px auto 60px;
      padding: 0 20px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 35px 0 18px;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--secondary-color);
    }

    .btn-outline {
      background-color: transparent;
      border: 1px solid var(--primary-color);
      color: var(--primary-color);
    }

    .btn-outline:hover {
      background-color: rgba(43, 88, 118, 0.08);
    }

    .btn-danger {
      background-color: #e53e3e;
      color: white;
    }

    .btn-danger:hover {
      background-color: #c53030;
    }

    .board-box {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 25px;
    }

    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #edf2f7;
      gap: 15px;
    }

    .item-row:last-child {
      border-bottom: none;
    }

    .tag {
      background: rgba(255, 126, 95, 0.12);
      color: var(--accent-color);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .item-content {
      flex-grow: 1;
      font-size: 0.95rem;
    }

    .item-date {
      color: var(--text-muted);
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 24px;
      box-shadow: var(--shadow);
      transition: var(--transition);
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid rgba(0, 0, 0, 0.03);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
      opacity: 0;
      transition: var(--transition);
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }

    .card:hover::before {
      opacity: 1;
    }

    .card-icon {
      font-size: 2.2rem;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .card-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #edf2f7;
      padding-bottom: 12px;
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary-color);
    }

    .close-btn {
      background: transparent;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      font-size: 0.9rem;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
    }

    .status-error {
      color: #e53e3e;
      font-size: 0.85rem;
      margin-top: 6px;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      color: var(--text-muted);
      font-size: 0.88rem;
      border-top: 1px solid #e2e8f0;
      margin-top: 40px;
    }

    @media (max-width: 600px) {
      header { padding: 40px 20px 60px; }
      .logo { font-size: 2rem; }
      .item-row { flex-direction: column; align-items: flex-start; gap: 6px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <div class="logo">LOK 家族資訊網</div>
      <p class="tagline">共享生活時刻 ‧ 家族資訊交流中心</p>
    </div>
  </header>

  <main>
    <!-- 最新公告區 -->
    <div class="section-header">
      <h2 class="section-title">📌 最新公告</h2>
      <button class="btn btn-outline" id="openAdminBtn">⚙️ 後台管理</button>
    </div>
    
    <div class="board-box" id="noticeContainer">
      <div style="text-align: center; color: var(--text-muted); padding: 20px;">載入中...</div>
    </div>

    <!-- 家族共用檔案櫃 -->
    <div class="section-header">
      <h2 class="section-title">📂 家族雲端檔案櫃 (.mov / .html / 圖片等)</h2>
      <button class="btn btn-primary" onclick="openUploadModal()">📤 上傳新檔案</button>
    </div>

    <div class="board-box" id="fileContainer">
      <div style="text-align: center; color: var(--text-muted); padding: 20px;">載入檔案櫃中...</div>
    </div>

    <!-- 快捷服務 -->
    <h2 class="section-title">🚀 快捷服務</h2>
    <div class="grid">
      <a href="#" class="card">
        <div>
          <div class="card-icon">📅</div>
          <div class="card-title">活動行事曆</div>
          <div class="card-desc">查看生日, 聚會及重要紀念日。</div>
        </div>
      </a>
      <a href="#" class="card">
        <div>
          <div class="card-icon">💬</div>
          <div class="card-title">家族留言板</div>
          <div class="card-desc">溫馨互動與近況交流專屬小天地。</div>
        </div>
      </a>
    </div>
  </main>

  <!-- 檔案上傳 Modal -->
  <div class="modal-backdrop" id="uploadModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">📤 上傳檔案至雲端</div>
        <button class="close-btn" onclick="closeUploadModal()">&times;</button>
      </div>
      <div class="form-group">
        <label>選擇檔案 (.mov, .html, .jpg, .pdf 等)：</label>
        <input type="file" id="fileInput">
      </div>
      <div class="form-group">
        <label>檔案說明 / 名稱：</label>
        <input type="text" id="fileDescInput" placeholder="例如：中秋節聚會影片.mov">
      </div>
      <div id="uploadStatus" style="font-size: 0.9rem; color: var(--primary-color); margin-bottom: 10px;"></div>
      <div style="text-align: right;">
        <button class="btn btn-primary" id="startUploadBtn" onclick="handleFileUpload()">確認上傳並發布</button>
      </div>
    </div>
  </div>

  <!-- 管理員登入 Modal -->
  <div class="modal-backdrop" id="loginModal">
    <div class="modal" style="max-width: 400px;">
      <div class="modal-header">
        <div class="modal-title">🔐 管理員登入</div>
        <button class="close-btn" onclick="closeLoginModal()">&times;</button>
      </div>
      <div class="form-group">
        <label>請輸入後台登入碼：</label>
        <input type="password" id="adminPasswordInput" placeholder="請輸入密碼">
        <div id="loginErrorMsg" class="status-error"></div>
      </div>
      <div style="text-align: right; margin-top: 15px;">
        <button class="btn btn-primary" id="loginSubmitBtn">驗證登入</button>
      </div>
    </div>
  </div>

  <!-- 後台管理 Modal -->
  <div class="modal-backdrop" id="adminModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">⚙️ 後台管理中心</div>
        <button class="close-btn" onclick="closeAdminModal()">&times;</button>
      </div>

      <div style="margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; background: #edf2f7; padding: 12px; border-radius: 8px; align-items: center;">
        <span style="font-size: 0.9rem; font-weight: bold; color: var(--primary-color);">📦 資料備份：</span>
        <button class="btn btn-outline" id="exportBackupBtn" style="background: white; font-size: 0.85rem;">💾 下載備份 (.json)</button>
        <label class="btn btn-outline" style="background: white; font-size: 0.85rem; cursor: pointer; margin-bottom: 0;">
          📂 匯入還原
          <input type="file" id="importBackupFile" accept=".json" style="display: none;">
        </label>
      </div>

      <div style="margin-bottom: 20px; border: 1px solid #e2e8f0; padding: 16px; border-radius: 8px; background: #fafafa;">
        <h3 style="font-size: 1rem; margin-bottom: 12px; color: var(--primary-color);">➕ 新增公告事項</h3>
        <div class="form-group">
          <label>標籤類別：</label>
          <select id="newNoticeTag">
            <option value="活動">活動</option>
            <option value="重要">重要</option>
            <option value="系統">系統</option>
            <option value="溫馨">溫馨</option>
          </select>
        </div>
        <div class="form-group">
          <label>公告內容：</label>
          <textarea id="newNoticeText" rows="3" placeholder="請輸入公告內容..."></textarea>
        </div>
        <button class="btn btn-primary" id="addNoticeBtn">新增公告</button>
      </div>

      <div>
        <h3 style="font-size: 1rem; margin-bottom: 10px; color: var(--primary-color);">📋 目前公告與檔案管理</h3>
        <div id="adminNoticeList"></div>
        <div id="adminFileList" style="margin-top: 15px;"></div>
      </div>

      <div style="margin-top: 24px; display: flex; justify-content: space-between; align-items: center;">
        <button class="btn btn-outline" onclick="closeAdminModal()">關閉</button>
        <button class="btn btn-primary" id="syncToCloudBtn" style="background-color: #38a169;">☁️ 儲存並同步至雲端伺服器</button>
      </div>
    </div>
  </div>

  <footer>
    <p>© LOK Family. All Rights Reserved.</p>
  </footer>

  <script>
    const JSONBIN_BIN_ID = '6ada3777ac6210605a49804e';
    const JSONBIN_MASTER_KEY = '$2a$10$Q3e6T7l53HKgJr3pc5tuW.5dTGTAyi6948TrSpoe7mNIZm6kaRMbm';
    const ADMIN_PASSWORD = 'LeLe-LOK';

    let siteData = { notices: [], files: [] };
    let isAuthenticated = false;

    const noticeContainer = document.getElementById('noticeContainer');
    const fileContainer = document.getElementById('fileContainer');
    const openAdminBtn = document.getElementById('openAdminBtn');
    const loginModal = document.getElementById('loginModal');
    const adminModal = document.getElementById('adminModal');
    const uploadModal = document.getElementById('uploadModal');
    const adminPasswordInput = document.getElementById('adminPasswordInput');
    const loginSubmitBtn = document.getElementById('loginSubmitBtn');
    const loginErrorMsg = document.getElementById('loginErrorMsg');
    const addNoticeBtn = document.getElementById('addNoticeBtn');
    const syncToCloudBtn = document.getElementById('syncToCloudBtn');
    const exportBackupBtn = document.getElementById('exportBackupBtn');
    const importBackupFile = document.getElementById('importBackupFile');

    window.addEventListener('DOMContentLoaded', () => {
      fetchDataFromCloud();
    });

    async function fetchDataFromCloud() {
      try {
        const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
          method: 'GET',
          headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
        });
        if (!response.ok) throw new Error('讀取失敗');
        const data = await response.json();
        
        if (data.record) {
          siteData.notices = Array.isArray(data.record.notices) ? data.record.notices : [];
          siteData.files = Array.isArray(data.record.files) ? data.record.files : [];
        }
        renderNotices();
        renderFiles();
      } catch (err) {
        noticeContainer.innerHTML = `<div style="text-align: center; color: #e53e3e; padding: 20px;">無法讀取資料：${err.message}</div>`;
        fileContainer.innerHTML = `<div style="text-align: center; color: #e53e3e; padding: 20px;">無法讀取檔案櫃</div>`;
      }
    }

    function renderNotices() {
      if (siteData.notices.length === 0) {
        noticeContainer.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 10px;">目前尚無公告。</div>';
        return;
      }
      noticeContainer.innerHTML = siteData.notices.map(item => `
        <div class="item-row">
          <span class="tag">${escapeHtml(item.tag || '公告')}</span>
          <span class="item-content">${escapeHtml(item.text)}</span>
          <span class="item-date">${escapeHtml(item.date)}</span>
        </div>
      `).join('');
    }

    function renderFiles() {
      if (siteData.files.length === 0) {
        fileContainer.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 10px;">目前尚無上傳檔案，點擊上方按鈕上傳。</div>';
        return;
      }
      fileContainer.innerHTML = siteData.files.map(item => `
        <div class="item-row">
          <span class="tag" style="background: rgba(43, 88, 118, 0.12); color: var(--primary-color);">檔案</span>
          <span class="item-content"><strong>${escapeHtml(item.name)}</strong></span>
          <span class="item-date">${escapeHtml(item.date)}</span>
          <a href="${escapeHtml(item.url)}" target="_blank" class="btn btn-outline" style="padding: 4px 10px; font-size: 0.85rem;">下載 / 檢視</a>
        </div>
      `).join('');
    }

    async function handleFileUpload() {
      const fileInput = document.getElementById('fileInput');
      const fileDescInput = document.getElementById('fileDescInput');
      const uploadStatus = document.getElementById('uploadStatus');

      if (fileInput.files.length === 0) {
        alert('請先選擇要上傳的檔案！');
        return;
      }

      const file = fileInput.files[0];
      const fileName = fileDescInput.value.trim() || file.name;

      uploadStatus.innerText = '正在上傳至免費雲端伺服器，請稍候...';

      try {
        const formData = new FormData();
        formData.append('file', file);

        const response = await fetch('https://0x0.st', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) throw new Error('上傳失敗');
        const fileUrl = (await response.text()).trim();
        
        if (!fileUrl.startsWith('http')) {
          throw new Error('伺服器未回傳有效連結');
        }

        siteData.files.unshift({
          name: fileName,
          url: fileUrl,
          date: new Date().toISOString().split('T')[0]
        });

        await saveToCloudSilent();

        uploadStatus.innerText = '上傳成功！已同步至雲端。';
        setTimeout(() => {
          closeUploadModal();
          renderFiles();
          fileInput.value = '';
          fileDescInput.value = '';
          uploadStatus.innerText = '';
        }, 1200);

      } catch (err) {
        uploadStatus.innerText = `上傳出錯: ${err.message}`;
      }
    }

    function openUploadModal() {
      document.getElementById('fileInput').value = '';
      document.getElementById('fileDescInput').value = '';
      document.getElementById('uploadStatus').innerText = '';
      uploadModal.style.display = 'flex';
    }
    function closeUploadModal() { uploadModal.style.display = 'none'; }

    openAdminBtn.addEventListener('click', () => {
      if (isAuthenticated) {
        openAdminPanel();
      } else {
        adminPasswordInput.value = '';
        loginErrorMsg.innerText = '';
        loginModal.style.display = 'flex';
        adminPasswordInput.focus();
      }
    });

    loginSubmitBtn.addEventListener('click', handleLogin);
    adminPasswordInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });

    function handleLogin() {
      if (adminPasswordInput.value === ADMIN_PASSWORD) {
        isAuthenticated = true;
        closeLoginModal();
        openAdminPanel();
      } else {
        loginErrorMsg.innerText = '登入碼錯誤！';
      }
    }
    function closeLoginModal() { loginModal.style.display = 'none'; }
    function openAdminPanel() {
      renderAdminLists();
      adminModal.style.display = 'flex';
    }
    function closeAdminModal() { adminModal.style.display = 'none'; }

    function renderAdminLists() {
      const adminNoticeList = document.getElementById('adminNoticeList');
      const adminFileList = document.getElementById('adminFileList');

      adminNoticeList.innerHTML = siteData.notices.length === 0 ? '<div style="color:var(--text-muted); font-size:0.9rem;">無公告</div>' :
        siteData.notices.map((item, idx) => `
          <div class="item-row" style="padding: 8px 0;">
            <span>[${escapeHtml(item.tag)}] ${escapeHtml(item.text)}</span>
            <button class="btn btn-danger" onclick="deleteNotice(${idx})" style="padding: 2px 6px; font-size: 0.75rem;">刪除</button>
          </div>
        `).join('');

      adminFileList.innerHTML = siteData.files.length === 0 ? '<div style="color:var(--text-muted); font-size:0.9rem;">無檔案</div>' :
        '<h4 style="font-size:0.95rem; margin-top:10px; color:var(--primary-color);">檔案管理：</h4>' +
        siteData.files.map((item, idx) => `
          <div class="item-row" style="padding: 8px 0;">
            <span>${escapeHtml(item.name)}</span>
            <button class="btn btn-danger" onclick="deleteFile(${idx})" style="padding: 2px 6px; font-size: 0.75rem;">刪除</button>
          </div>
        `).join('');
    }

    window.deleteNotice = function(idx) {
      siteData.notices.splice(idx, 1);
      renderAdminLists();
      renderNotices();
    };

    window.deleteFile = function(idx) {
      siteData.files.splice(idx, 1);
      renderAdminLists();
      renderFiles();
    };

    addNoticeBtn.addEventListener('click', () => {
      const tag = document.getElementById('newNoticeTag').value;
      const text = document.getElementById('newNoticeText').value.trim();
      if (!text) { alert('請輸入內容'); return; }
      siteData.notices.unshift({ id: Date.now().toString(), tag, text, date: new Date().toISOString().split('T')[0] });
      document.getElementById('newNoticeText').value = '';
      renderAdminLists();
      renderNotices();
    });

    async function saveToCloudSilent() {
      await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_MASTER_KEY },
        body: JSON.stringify(siteData)
      });
    }

    syncToCloudBtn.addEventListener('click', async () => {
      syncToCloudBtn.innerText = '同步中...';
      syncToCloudBtn.disabled = true;
      try {
        await saveToCloudSilent();
        alert('成功同步至雲端伺服器！');
        closeAdminModal();
      } catch (err) {
        alert('同步失敗: ' + err.message);
      } finally {
        syncToCloudBtn.innerText = '☁️ 儲存並同步至雲端伺服器';
        syncToCloudBtn.disabled = false;
      }
    });

    exportBackupBtn.addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(siteData, null, 2));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = `lok_family_full_backup_${new Date().toISOString().split('T')[0]}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    });

    importBackupFile.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const parsed = JSON.parse(event.target.result);
          if (parsed.notices || parsed.files) {
            siteData.notices = parsed.notices || [];
            siteData.files = parsed.files || [];
            renderAdminLists();
            renderNotices();
            renderFiles();
            alert('還原成功！請點擊右下角同步至雲端。');
          } else {
            alert('格式不符');
          }
        } catch (err) { alert('解析錯誤: ' + err.message); }
        importBackupFile.value = '';
      };
      reader.readAsText(file);
    });

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
